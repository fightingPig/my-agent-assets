name: Desktop Beta Release

on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new beta tag for the current commit
        required: true
        type: string

jobs:
  validate-release:
    name: Validate release identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify synchronized product version and tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          node apps/desktop/scripts/check-release-version.mjs
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            test "${tag_commit}" = "${GITHUB_SHA}"
          fi

  build-macos:
    name: Build macOS arm64 beta
    needs: validate-release
    runs-on: macos-14
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend
        run: |
          npm run typecheck
          npm test -- --run

      - name: Build ad-hoc signed macOS beta
        run: npm run tauri -- build --target aarch64-apple-darwin

      - name: Verify macOS bundle and DMG
        working-directory: ${{ github.workspace }}
        run: |
          codesign --verify --deep --strict "target/aarch64-apple-darwin/release/bundle/macos/My Agent Assets.app"
          hdiutil verify "target/aarch64-apple-darwin/release/bundle/dmg/"*.dmg

      - name: Upload macOS beta
        uses: actions/upload-artifact@v4
        with:
          name: my-agent-assets-macos-arm64-beta
          if-no-files-found: error
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    name: Build Windows x64 beta
    needs: validate-release
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend and Rust adapters
        run: |
          npm run typecheck
          npm test -- --run
          cargo test --workspace --no-fail-fast

      - name: Build unsigned Windows beta installers
        run: npm run tauri -- build --config src-tauri/tauri.windows.conf.json

      - name: Verify Windows binary uses the GUI subsystem
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $binaryPath = Join-Path $env:GITHUB_WORKSPACE "target/release/my-agent-assets-desktop.exe"
          if (!(Test-Path -LiteralPath $binaryPath)) {
            throw "Windows desktop binary was not found: $binaryPath"
          }
          $bytes = [System.IO.File]::ReadAllBytes($binaryPath)
          $peHeaderOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          if ([System.Text.Encoding]::ASCII.GetString($bytes, $peHeaderOffset, 4) -ne "PE`0`0") {
            throw "The desktop binary does not contain a valid PE header."
          }
          $optionalHeaderOffset = $peHeaderOffset + 24
          $subsystemOffset = $optionalHeaderOffset + 68
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $subsystemOffset)
          if ($subsystem -ne 2) {
            throw "Expected Windows GUI subsystem (2), received $subsystem."
          }

      - name: Upload Windows beta
        uses: actions/upload-artifact@v4
        with:
          name: my-agent-assets-windows-x64-beta
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  publish:
    name: Publish public beta prerelease
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: Prepare public release assets
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-upload

          macos_dmg="$(find release-assets -type f -name '*.dmg' -print -quit)"
          windows_msi="$(find release-assets -type f -name '*.msi' -print -quit)"
          windows_exe="$(find release-assets -type f -name '*.exe' -print -quit)"

          test -n "$macos_dmg"
          test -n "$windows_msi"
          test -n "$windows_exe"

          cp "$macos_dmg" "release-upload/My-Agent-Assets-${RELEASE_TAG}-macOS-arm64.dmg"
          cp "$windows_msi" "release-upload/My-Agent-Assets-${RELEASE_TAG}-Windows-x64.msi"
          cp "$windows_exe" "release-upload/My-Agent-Assets-${RELEASE_TAG}-Windows-x64-Setup.exe"

          (
            cd release-upload
            sha256sum ./* > SHA256SUMS.txt
          )

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: My Agent Assets ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          body: |
            Cross-platform V1 beta candidate.

            - macOS: Apple Silicon, ad-hoc signed, not notarized.
            - Windows: unsigned MSI and NSIS test installers.
            - Beta.1 may have left an empty ~/.my-agent-assets/locks directory; after confirming it is empty and no operation is running, remove it manually if needed.
            - This prerelease is for controlled validation and is not V1 Stable.
          files: release-upload/*
