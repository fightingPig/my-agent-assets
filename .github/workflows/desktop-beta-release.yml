name: Desktop Beta Release

on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new beta tag for the current commit
        required: true
        type: string

jobs:
  build-macos:
    name: Build macOS arm64 beta
    runs-on: macos-14
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend
        run: |
          npm run typecheck
          npm test -- --run

      - name: Build ad-hoc signed macOS beta
        run: npm run tauri -- build --target aarch64-apple-darwin

      - name: Verify macOS bundle and DMG
        working-directory: ${{ github.workspace }}
        run: |
          codesign --verify --deep --strict "target/aarch64-apple-darwin/release/bundle/macos/My Agent Assets.app"
          hdiutil verify "target/aarch64-apple-darwin/release/bundle/dmg/"*.dmg

      - name: Upload macOS beta
        uses: actions/upload-artifact@v4
        with:
          name: my-agent-assets-macos-arm64-beta
          if-no-files-found: error
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    name: Build Windows x64 beta
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend and Rust adapters
        run: |
          npm run typecheck
          npm test -- --run
          cargo test --workspace --no-fail-fast

      - name: Build unsigned Windows beta installers
        run: npm run tauri -- build --config src-tauri/tauri.windows.conf.json

      - name: Upload Windows beta
        uses: actions/upload-artifact@v4
        with:
          name: my-agent-assets-windows-x64-beta
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  publish:
    name: Publish private beta prerelease
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')"
          if [ "$visibility" != "private" ]; then
            echo "::error::Beta release publishing is blocked because repository visibility is '$visibility', not 'private'."
            exit 1
          fi

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: My Agent Assets ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          body: |
            Cross-platform V1 beta candidate.

            - macOS: Apple Silicon, ad-hoc signed, not notarized.
            - Windows: unsigned MSI and NSIS test installers.
            - This prerelease is for controlled validation and is not V1 Stable.
          files: release-assets/**/*
